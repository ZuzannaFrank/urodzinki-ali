<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#fff4f7">
    <title>Wszystkiego najlepszego, Alu!</title>
    <link rel="stylesheet" href="style.css">
    <script src="script.js" defer></script>
</head>
<body>
    <main class="birthday-card">
        <div class="sparkle sparkle-one" aria-hidden="true">✦</div>
        <div class="sparkle sparkle-two" aria-hidden="true">✧</div>

        <p class="eyebrow">Dziś jest Twój dzień!</p>
        <div class="cake" aria-hidden="true">🎂</div>
        <h1>Wszystkiego najlepszego,<br><span>Alu!</span></h1>
        <p class="message">
            Niech każdy dzień przynosi Ci mnóstwo powodów do uśmiechu,
            spełnienia marzeń, cudownych przygód i samych wspaniałych ludzi wokół.
            Życzę Ci dnia pełnego radości, śmiechu i oczywiście pysznego tortu!
        </p>
        <p class="signature">Sto lat! <span aria-hidden="true">💖</span></p>
        <button id="celebrate-button" type="button">Kliknij po urodzinowe konfetti!</button>
        <p id="celebration-message" class="celebration-message" aria-live="polite"></p>
    </main>
</body>
</html>
